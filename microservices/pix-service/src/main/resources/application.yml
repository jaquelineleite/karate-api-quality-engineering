spring:
  application:
    name: pix-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/bookingdb}
    username: ${DB_USERNAME:qa_user}
    password: ${DB_PASSWORD:qa_password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always
