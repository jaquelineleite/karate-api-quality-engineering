spring:
  application:
    name: payment-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/bookingdb}
    username: ${DB_USERNAME:qa_user}
    password: ${DB_PASSWORD:qa_password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
