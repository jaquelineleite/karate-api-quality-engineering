name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  regression-tests:
    name: Karate Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar regressão Karate
        run: mvn test -Dtest=RegressionRunner

      - name: Publicar relatório Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-regression-report
          path: target/karate-reports/

  full-api-tests:
    name: Karate Full API Suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Booking Service
        run: mvn -f microservices/booking-service/pom.xml clean package -DskipTests

      - name: Build Payment Service
        run: mvn -f microservices/payment-service/pom.xml clean package -DskipTests

      - name: Build PIX Service
        run: mvn -f microservices/pix-service/pom.xml clean package -DskipTests

      - name: Subir ambiente para suíte completa
        run: docker compose -f infrastructure/docker-compose.yml up -d --build postgres payment-service pix-service booking-service

      - name: Aguardar serviços necessários
        run: |
          for endpoint in http://localhost:8081/actuator/health http://localhost:8082/actuator/health http://localhost:8083/actuator/health; do
            healthy=false
            for i in {1..30}; do
              if curl -fsS "$endpoint"; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              echo "Servico nao ficou saudavel: $endpoint"
              docker compose -f infrastructure/docker-compose.yml logs
              exit 1
            fi
          done

      - name: Executar suíte completa Karate
        run: mvn clean test

      - name: Publicar relatório Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-full-report
          path: target/karate-reports/

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs

      - name: Encerrar ambiente
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v

  performance-smoke:
    name: k6 Performance Smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Validar versão do k6
        run: k6 version

      - name: Executar smoke de performance
        run: k6 run performance/k6/smoke.js

  microservices-integration:
    name: Microservices Integration Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Booking Service
        run: mvn -f microservices/booking-service/pom.xml clean package -DskipTests

      - name: Build Payment Service
        run: mvn -f microservices/payment-service/pom.xml clean package -DskipTests

      - name: Build PIX Service
        run: mvn -f microservices/pix-service/pom.xml clean package -DskipTests

      - name: Subir ambiente de microsserviços
        run: docker compose -f infrastructure/docker-compose.yml up -d --build

      - name: Aguardar Booking Service
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8081/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Aguardar PIX Service
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8083/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          echo "PIX Service nao ficou saudavel dentro do tempo limite."
          docker compose -f infrastructure/docker-compose.yml logs pix-service
          exit 1

      - name: Executar testes funcionais e paralelos de integração
        run: mvn test -Dtest=MicroservicesRunner,MicroservicesParallelRunner,PixConcurrencyTest

      - name: Publicar relatório de integração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-microservices-report
          path: target/karate-reports/

      - name: Exibir logs dos microsserviços em caso de falha
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs

      - name: Encerrar ambiente
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v
