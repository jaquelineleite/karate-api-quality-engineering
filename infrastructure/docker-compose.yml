services:
  postgres:
    image: postgres:17
    container_name: karate-qe-postgres
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5435:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - booking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ../microservices/payment-service
    container_name: karate-qe-payment
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build:
      context: ../microservices/booking-service
    container_name: karate-qe-booking
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bookingdb
      DB_USERNAME: qa_user
      DB_PASSWORD: qa_password
      PAYMENT_SERVICE_URL: http://payment-service:8082
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: karate-qe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - booking-service
      - payment-service

  grafana:
    image: grafana/grafana:latest
    container_name: karate-qe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  booking_postgres_data:
