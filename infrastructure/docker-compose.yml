services:
  postgres:
    image: postgres:17
    container_name: karate-qe-postgres
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5435:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - booking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ../microservices/payment-service
    container_name: karate-qe-payment
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build:
      context: ../microservices/booking-service
    container_name: karate-qe-booking
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bookingdb
      DB_USERNAME: qa_user
      DB_PASSWORD: qa_password
      PAYMENT_SERVICE_URL: http://payment-service:8082
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started

volumes:
  booking_postgres_data:
