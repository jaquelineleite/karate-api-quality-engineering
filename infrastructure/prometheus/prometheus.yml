global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - booking-service:8081

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service:8082
